[project]
name = "zapdos-dataset"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["click", "datasets", "numpy", "zarr>=3"]

[project.scripts]
zapdos-dataset = "zapdos_dataset:main"
zapdos-functions = "zapdos_functions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["zapdos_dataset.py", "zapdos_functions.py"]
