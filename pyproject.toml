[project]
name = "zapdos-dataset"
version = "0.2.0"
description = "Turn raw side-channel recordings (.npz) into a Hugging Face dataset that can be shipped in place of the raw traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "datasets>=2.14",
    "numpy>=1.24",
]

[project.scripts]
zapdos-dataset = "zapdos_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zapdos_dataset"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
