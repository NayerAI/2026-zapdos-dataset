[project]
name = "zapdos-dataset"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["click", "datasets", "numpy"]

[project.scripts]
zapdos-dataset = "zapdos_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["zapdos_dataset.py"]
