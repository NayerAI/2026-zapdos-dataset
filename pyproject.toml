[project]
name = "zapdos-dataset"
version = "0.9.0"
requires-python = ">=3.11"
dependencies = ["capstone", "click", "datasets", "matplotlib", "numpy", "zarr>=3"]

[project.scripts]
zapdos-dataset = "zapdos_dataset:main"
zapdos-functions = "zapdos_functions:main"
zapdos-plot = "zapdos_plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["zapdos_dataset.py", "zapdos_functions.py", "zapdos_plot.py"]
